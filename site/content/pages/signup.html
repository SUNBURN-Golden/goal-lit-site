<h1>회원가입 · 뉴스레터</h1>
<p class="lead">별도 가입 폼 없이 소셜 계정(Google) 연동만으로 3초 만에 가입할 수 있어요. 가입과 동시에 주간 뉴스레터 구독 여부를 선택할 수 있어요.</p>
<div class="auth-card" id="auth-box">
 <form method="GET" action="/api/auth/google" class="auth-form" id="signup-form">
  <label class="auth-check" for="newsletter-check">
   <input type="checkbox" name="newsletter" value="1" checked id="newsletter-check">
   <span><strong>매주 화요일 &lsquo;한 작품·한 비평&rsquo; 뉴스레터 함께 받기</strong><br><span class="muted">편집부 칼럼과 그 주의 작품 비평 한 편을 이메일로 보내 드려요. 가입 뒤 언제든 해지할 수 있어요.</span></span>
  </label>
  <div class="cta-row">
   <button type="submit" class="cta cta-main auth-btn">Google 계정으로 시작하기</button>
  </div>
 </form>
 <p class="muted auth-note" id="auth-status">비밀번호나 별도 입력 폼을 받지 않고 Google 계정의 이메일 주소만 확인해요. 자세한 내용은 <a href="/privacy/">개인정보 처리 안내</a>에 적혀 있어요.</p>
</div>
<script src="/assets/js/auth.js" defer></script>
