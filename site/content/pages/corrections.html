<h1>정정·삭제 요청</h1>
<p class="lead">틀린 정보, 잘못 요약된 의견, 삭제가 필요한 내용이 있으면 알려 주세요. 확인하고 고칠게요.</p>
<ul>
 <li>작품 정보가 사실과 다르면: 어느 페이지의 어떤 항목인지, 맞는 정보와 출처 링크를 알려 주세요.</li>
 <li>기사·후기가 잘못 요약됐다고 생각하면: 해당 글과 문장을 알려 주세요. 확인 후 고치거나 내려요.</li>
 <li>저작권자·창작자·인용된 매체의 삭제 요청은 우선 처리해요.</li>
</ul>
<p>운영자 연락처: <strong>공개 전에 확정</strong>해서 이 자리에 적어요.</p>
