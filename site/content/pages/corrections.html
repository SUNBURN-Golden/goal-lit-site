<h1>정정·삭제 요청</h1>
<p class="muted">비공개 프리뷰 · 초안</p>
<p class="lead">틀린 정보, 잘못 요약된 의견, 삭제 요청을 받는다.</p>
<ul>
 <li>작품 정보가 사실과 다를 때: 어느 페이지의 어떤 항목인지, 맞는 정보와 출처 링크를 알려 주면 확인한다.</li>
 <li>기사·후기가 잘못 요약됐다고 볼 때: 해당 글과 문장을 알려 주면 확인한 뒤 고치거나 내린다.</li>
 <li>저작권자·창작자·인용된 매체의 삭제 요청은 우선 처리한다.</li>
</ul>
<p>운영자 연락처: <strong>공개 전에 확정</strong>해 이 자리에 적는다.</p>
